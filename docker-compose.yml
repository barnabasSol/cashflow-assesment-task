services:
  payment-service:
    depends_on:
      - rabbitmq
      - postgres
    build:
      context: payment-service
      dockerfile: dockerfile
    restart: always
    ports:
      - "1000:1000"
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - back-tier

  payment-worker:
    build:
      context: payment-worker
      dockerfile: dockerfile
    restart: always
    depends_on:
      - rabbitmq
      - postgres
    env_file:
      - payment-worker/.env
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - back-tier

  rabbitmq:
    image: rabbitmq:4.1.3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: strongpassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - back-tier

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - back-tier

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  back-tier:
    driver: bridge
